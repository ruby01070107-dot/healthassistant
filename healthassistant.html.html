<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨健康小幫手 | 多巴胺紀錄站✨</title>
    <style>
        :root {
            /* 多巴胺配色 */
            --bg-color: #ffffff;
            --primary: #FF69B4; /* 熱情粉 */
            --secondary: #FFD700; /* 活力黃 */
            --accent: #00BFFF; /* 清爽藍 */
            --success: #32CD32; /* 療癒綠 */
            --text-color: #333;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            /* 讓邊框有點彩虹感 */
            border: 3px solid transparent;
            background-image: linear-gradient(white, white), linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: var(--card-shadow);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .date-picker-section {
            background-color: #fff8e1; /* 淡黃色背景 */
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid var(--secondary);
        }

        input[type="date"] {
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid var(--accent);
            border-radius: 10px;
            color: var(--text-color);
        }

        /* 區塊通用樣式 */
        .section-card {
            background: #fdfdfd;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 8px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .section-card:hover {
            transform: translateY(-3px);
        }

        h2 {
            color: var(--accent);
            border-bottom: 2px dashed #eee;
            padding-bottom: 10px;
        }

        /* 1. 用藥紀錄 */
        .med-group {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            background: #fff0f5;
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid pink;
        }

        input[type="checkbox"] {
            width: 25px;
            height: 25px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* 鼓勵動畫區 */
        #celebration-area {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            min-height: 50px;
            margin-top: 10px;
            display: none; /* 預設隱藏 */
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 2. 睡眠紀錄 */
        .sleep-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="time"], input[type="text"], textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        /* 3. 運動紀錄 */
        .exercise-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* 4. 開心日記 */
        .happy-box textarea {
            border: 2px solid var(--secondary);
            background-color: #fffff0;
        }

        /* 5. 下載與按鈕 */
        .action-bar {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            color: white;
            margin: 5px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-save {
            background-color: var(--success);
        }

        .btn-download {
            background-color: var(--accent);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }

        .info-text {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            margin-top: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💊 健康小幫手 💤</h1>
        <p>2025-2026 用藥・睡眠・運動紀錄</p>
    </header>

    <div class="date-picker-section">
        <label for="recordDate">📅 今天是：</label>
        <input type="date" id="recordDate" onchange="loadData()">
    </div>

    <form id="healthForm">
        
        <div class="section-card" style="border-left-color: var(--primary);">
            <h2>💊 用藥紀錄 (Medication)</h2>
            <div class="med-group">
                <label class="checkbox-wrapper">
                    <span>☀️ 早餐後</span>
                    <input type="checkbox" id="medBreakfast" onchange="checkMedication()">
                </label>
                <label class="checkbox-wrapper">
                    <span>🍱 午餐後</span>
                    <input type="checkbox" id="medLunch" onchange="checkMedication()">
                </label>
                <label class="checkbox-wrapper">
                    <span>🌙 晚餐後</span>
                    <input type="checkbox" id="medDinner" onchange="checkMedication()">
                </label>
                <label class="checkbox-wrapper">
                    <span>🛌 睡前</span>
                    <input type="checkbox" id="medBedtime" onchange="checkMedication()">
                </label>
            </div>
            <div id="celebration-area"></div>
        </div>

        <div class="section-card" style="border-left-color: #9370DB;">
            <h2>💤 睡眠紀錄 (Sleep)</h2>
            <div class="sleep-grid">
                <div>
                    <label>🛌 幾點睡覺</label>
                    <input type="time" id="sleepTime" onchange="calcSleepDuration()">
                </div>
                <div>
                    <label>🌅 幾點起床</label>
                    <input type="time" id="wakeTime" onchange="calcSleepDuration()">
                </div>
                <div class="full-width">
                    <label>⏱️ 睡眠總時間</label>
                    <input type="text" id="totalSleep" readonly placeholder="自動計算..." style="background:#eee; color:blue; font-weight:bold;">
                </div>
                <div class="full-width">
                    <label>🐑 睡不著做什麼？/ 做了什麼睡比較久？</label>
                    <textarea id="sleepNotes" placeholder="例：聽輕音樂、喝熱牛奶..."></textarea>
                </div>
            </div>
        </div>

        <div class="section-card" style="border-left-color: var(--success);">
            <h2>🏃‍♀️ 運動紀錄 (Exercise)</h2>
            <div class="exercise-row">
                <input type="text" id="ex1Type" placeholder="運動項目 (例: 慢跑)">
                <input type="text" id="ex1Time" placeholder="時間 (例: 30分)">
            </div>
            <div class="exercise-row">
                <input type="text" id="ex2Type" placeholder="運動項目 (例: 瑜珈)">
                <input type="text" id="ex2Time" placeholder="時間 (例: 1小時)">
            </div>
        </div>

        <div class="section-card happy-box" style="border-left-color: var(--secondary);">
            <h2>😊 今天發生什麼開心的事？</h2>
            <textarea id="happyNotes" placeholder="記錄下微小的幸福，讓心情變好..."></textarea>
        </div>

        <div class="action-bar">
            <button type="button" class="btn btn-save" onclick="saveData()">💾 儲存今日紀錄</button>
            <button type="button" class="btn btn-download" onclick="exportToExcel()">📊 下載 Excel 表格</button>
            <p class="info-text">💡 記得每天按「儲存」。資料存在您的瀏覽器中。</p>
        </div>

    </form>
</div>

<script>
    // 初始化：設定日期為今天
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('recordDate').value = today;
        loadData(); // 載入今天的資料
    };

    // 鼓勵語錄
    const praises = [
        "🎉 Excellent! 你好棒！",
        "🌟 太完美了！為健康加分！",
        "💪 堅持就是勝利，你是最棒的！",
        "💖 愛自己，從按時吃藥開始！",
        "🎆 哇！全部完成，給妳一個煙火！"
    ];

    // 1. 檢查用藥並顯示動畫
    function checkMedication() {
        const b = document.getElementById('medBreakfast').checked;
        const l = document.getElementById('medLunch').checked;
        const d = document.getElementById('medDinner').checked;
        const s = document.getElementById('medBedtime').checked;

        const area = document.getElementById('celebration-area');

        if (b && l && d && s) {
            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            area.innerHTML = randomPraise + " 🎆🎆🎆";
            area.style.display = "block";
        } else {
            area.style.display = "none";
        }
    }

    // 2. 計算睡眠時間
    function calcSleepDuration() {
        const start = document.getElementById('sleepTime').value;
        const end = document.getElementById('wakeTime').value;

        if (start && end) {
            let startDate = new Date(`2000-01-01T${start}`);
            let endDate = new Date(`2000-01-01T${end}`);

            // 如果起床時間比睡覺時間早，代表跨夜了 (例如 23:00 睡, 07:00 起)
            if (endDate < startDate) {
                endDate.setDate(endDate.getDate() + 1);
            }

            const diff = endDate - startDate;
            const hours = Math.floor(diff / 1000 / 60 / 60);
            const minutes = Math.floor((diff / 1000 / 60) % 60);

            document.getElementById('totalSleep').value = `${hours} 小時 ${minutes} 分鐘`;
        }
    }

    // 3. 儲存資料到 LocalStorage
    function saveData() {
        const date = document.getElementById('recordDate').value;
        if (!date) { alert("請選擇日期！"); return; }

        const data = {
            meds: {
                breakfast: document.getElementById('medBreakfast').checked,
                lunch: document.getElementById('medLunch').checked,
                dinner: document.getElementById('medDinner').checked,
                bedtime: document.getElementById('medBedtime').checked
            },
            sleep: {
                start: document.getElementById('sleepTime').value,
                end: document.getElementById('wakeTime').value,
                total: document.getElementById('totalSleep').value,
                notes: document.getElementById('sleepNotes').value
            },
            exercise: [
                { type: document.getElementById('ex1Type').value, time: document.getElementById('ex1Time').value },
                { type: document.getElementById('ex2Type').value, time: document.getElementById('ex2Time').value }
            ],
            happy: document.getElementById('happyNotes').value
        };

        // 取出舊有資料庫
        let allData = JSON.parse(localStorage.getItem('healthAssistantData')) || {};
        allData[date] = data; // 存入該日期的資料
        localStorage.setItem('healthAssistantData', JSON.stringify(allData));

        alert("✅ " + date + " 的紀錄已儲存！\n明天也要加油喔！");
    }

    // 4. 讀取資料
    function loadData() {
        const date = document.getElementById('recordDate').value;
        let allData = JSON.parse(localStorage.getItem('healthAssistantData')) || {};
        const data = allData[date];

        // 重置欄位
        document.getElementById('healthForm').reset();
        document.getElementById('celebration-area').style.display = "none";

        if (data) {
            // 回填資料
            document.getElementById('medBreakfast').checked = data.meds.breakfast;
            document.getElementById('medLunch').checked = data.meds.lunch;
            document.getElementById('medDinner').checked = data.meds.dinner;
            document.getElementById('medBedtime').checked = data.meds.bedtime;
            
            checkMedication(); // 檢查是否要顯示煙火

            document.getElementById('sleepTime').value = data.sleep.start;
            document.getElementById('wakeTime').value = data.sleep.end;
            document.getElementById('totalSleep').value = data.sleep.total;
            document.getElementById('sleepNotes').value = data.sleep.notes;

            if(data.exercise[0]) {
                document.getElementById('ex1Type').value = data.exercise[0].type;
                document.getElementById('ex1Time').value = data.exercise[0].time;
            }
            if(data.exercise[1]) {
                document.getElementById('ex2Type').value = data.exercise[1].type;
                document.getElementById('ex2Time').value = data.exercise[1].time;
            }

            document.getElementById('happyNotes').value = data.happy;
        }
    }

    // 5. 匯出 Excel (CSV)
    function exportToExcel() {
        let allData = JSON.parse(localStorage.getItem('healthAssistantData')) || {};
        
        // 建立 CSV 標頭
        let csvContent = "\uFEFF"; // 加入 BOM 以防止中文亂碼
        csvContent += "日期,早餐藥,午餐藥,晚餐藥,睡前藥,入睡時間,起床時間,總睡眠,睡眠筆記,運動1項目,運動1時間,運動2項目,運動2時間,開心日記\n";

        // 整理資料
        // 將日期排序
        const sortedDates = Object.keys(allData).sort();

        sortedDates.forEach(date => {
            const d = allData[date];
            // 處理 checkbox 轉成 文字
            const medB = d.meds.breakfast ? "V" : "";
            const medL = d.meds.lunch ? "V" : "";
            const medD = d.meds.dinner ? "V" : "";
            const medS = d.meds.bedtime ? "V" : "";

            // 處理逗號，避免 CSV 格式跑掉
            const sleepNote = (d.sleep.notes || "").replace(/,/g, "，").replace(/\n/g, " ");
            const happyNote = (d.happy || "").replace(/,/g, "，").replace(/\n/g, " ");

            let row = `${date},${medB},${medL},${medD},${medS},${d.sleep.start},${d.sleep.end},${d.sleep.total},${sleepNote},${d.exercise[0].type},${d.exercise[0].time},${d.exercise[1].type},${d.exercise[1].time},${happyNote}`;
            csvContent += row + "\n";
        });

        // 觸發下載
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "健康小幫手紀錄表.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
