<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康小幫手: 用藥睡眠運動紀錄</title>
    <style>
        /* --- Dopamine Colors & General Styles --- */
        :root {
            --color-white: #ffffff;
            --color-pink: #ff69b4;     /* 亮粉 */
            --color-yellow: #ffd700;   /* 金黃 */
            --color-turquoise: #40e0d0; /* 土耳其藍 */
            --color-orange: #ffa500;   /* 鮮橙 */
            --color-green: #3cb371;    /* 鼓勵綠 */
            --color-shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-white); /* 底圖白色 */
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--color-white);
            padding: 20px;
            box-shadow: 0 4px 15px var(--color-shadow);
            border-radius: 12px;
        }

        h1 {
            color: var(--color-pink);
            text-align: center;
            border-bottom: 2px solid var(--color-pink);
            padding-bottom: 10px;
        }

        /* --- Month Tabs Style --- */
        .month-tabs {
            display: flex;
            overflow-x: auto;
            margin-bottom: 20px;
            padding: 5px 0;
            border-bottom: 3px solid #eee;
        }
        .month-tabs button {
            flex-shrink: 0;
            padding: 10px 15px;
            margin-right: 5px;
            background-color: #f0f0f0;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }
        .month-tabs button.active {
            background-color: var(--color-turquoise);
            color: var(--color-white);
        }

        /* --- Daily Calendar Style --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }
        .date-card {
            background-color: #fffaf0; /* 奶白色 */
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px var(--color-shadow);
            cursor: pointer;
            border-left: 5px solid var(--color-yellow);
            transition: transform 0.2s, background-color 0.2s;
        }
        .date-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px var(--color-shadow);
        }
        .date-card.has-record {
            border-left: 5px solid var(--color-green);
            background-color: #f0fff0; /* 淺綠 */
        }
        .date-card h3 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 1.2em;
            color: var(--color-orange);
        }

        /* --- Modal and Form Styles --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: var(--color-white);
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px var(--color-shadow);
            width: 80%;
            max-width: 600px;
            position: relative;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .form-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #fefefe;
        }
        .form-section h3 {
            color: var(--color-pink);
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
            margin-top: 0;
        }

        /* --- Custom Checkbox/Input Styles --- */
        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            margin-right: 15px;
            font-weight: 500;
            color: #555;
        }
        input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 8px;
            accent-color: var(--color-turquoise);
        }
        input[type="time"], input[type="number"], textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .sleep-time-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .sleep-time-group input {
            width: 45%;
        }

        /* --- Success/Animation Feedback --- */
        #medication-feedback {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--color-green);
            margin-top: 10px;
        }
        .medication-success {
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.05); opacity: 0.9; }
        }

        /* --- Footer/Progress --- */
        .footer-controls {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-indicator {
            font-size: 1.1em;
            color: #555;
            font-weight: 600;
        }
        .download-btn {
            background-color: var(--color-orange);
            color: var(--color-white);
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .download-btn:hover {
            background-color: #e59400;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ 健康小幫手：用藥、睡眠、運動紀錄 ✨</h1>
    <p style="text-align: center; color: #666;">記錄區間：114年12月6日 ~ 115年7月31日</p>

    <div id="monthTabs" class="month-tabs">
        </div>

    <div id="calendarGrid" class="calendar-grid">
        </div>

    <div class="footer-controls">
        <div id="progressIndicator" class="progress-indicator">
            總體紀錄進度：0 / 239 天
        </div>
        <button id="downloadBtn" class="download-btn" onclick="downloadData()">
            ⬇️ 下載 Excel 紀錄檔 (CSV)
        </button>
    </div>
</div>

<div id="recordModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalDateTitle" style="color: var(--color-turquoise);"></h2>

        <form id="dailyRecordForm">
            <div class="form-section">
                <h3>💊 用藥紀錄</h3>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="medication" value="breakfast" onchange="checkMedicationCompletion()"> 早餐後</label>
                    <label><input type="checkbox" name="medication" value="lunch" onchange="checkMedicationCompletion()"> 午餐後</label>
                    <label><input type="checkbox" name="medication" value="dinner" onchange="checkMedicationCompletion()"> 晚餐後</label>
                    <label><input type="checkbox" name="medication" value="bedtime" onchange="checkMedicationCompletion()"> 睡前</label>
                </div>
                <div id="medication-feedback"></div>
            </div>

            <div class="form-section">
                <h3>😴 睡眠紀錄</h3>
                <div class="sleep-time-group">
                    <label for="sleepTime">幾點睡覺:</label>
                    <input type="time" id="sleepTime" name="sleepTime" onchange="calculateSleepDuration()">
                    <label for="wakeTime">幾點清醒:</label>
                    <input type="time" id="wakeTime" name="wakeTime" onchange="calculateSleepDuration()">
                </div>
                <p>睡眠總時間: <strong id="durationDisplay">0 小時 0 分鐘</strong></p>
                <input type="hidden" id="sleepDuration" name="sleepDuration">

                <label for="cantSleep">睡不著可以做什麼 (建議):</label>
                <textarea id="cantSleep" name="cantSleep" placeholder="例如：聽白噪音、冥想... (預設提供建議，此處讓使用者輸入自己的認知)"></textarea>
                
                <label for="sleepHelper">我做了什麼睡得比較久:</label>
                <textarea id="sleepHelper" name="sleepHelper" placeholder="實際嘗試並有效的活動"></textarea>
            </div>

            <div class="form-section">
                <h3>🏃 運動紀錄</h3>
                <div id="exerciseInputs">
                    <label>運動 1:</label>
                    <input type="text" name="exerciseName1" placeholder="運動名稱 (如：慢跑)">
                    <input type="number" name="exerciseDuration1" placeholder="時間 (分鐘)">
                    
                    <label>運動 2 (可選):</label>
                    <input type="text" name="exerciseName2" placeholder="運動名稱 (如：瑜伽)">
                    <input type="number" name="exerciseDuration2" placeholder="時間 (分鐘)">
                </div>
                <button type="button" style="background-color: var(--color-turquoise); color: var(--color-white);" onclick="addExerciseField()">+ 增加運動項目</button>
            </div>

            <div class="form-section">
                <h3>😄 開心紀錄</h3>
                <label for="happyEvent">今天做了什麼事讓我很開心:</label>
                <textarea id="happyEvent" name="happyEvent" placeholder="寫下今天讓你心情好的事，為生活增添色彩！"></textarea>
            </div>

            <button type="submit" style="background-color: var(--color-pink); color: var(--color-white); padding: 12px; width: 100%; font-size: 1.1em;">儲存紀錄</button>
        </form>
    </div>
</div>

<script>
    // 修正：確保日期格式正確，月份是從 0 開始 (11=12月, 6=7月)
    const START_DATE = new Date(2025, 11, 6); // 2025年12月6日
    const END_DATE = new Date(2026, 6, 31);   // 2026年7月31日 (Minguo 115)
    let CURRENT_DATE_STR = ''; // 紀錄目前開啟的日期 (YYYY-MM-DD 格式)
    
    // (1) 鼓勵訊息列表 (不重複)
    const encouragementMessages = [
        "Excellent! 你好棒！🔥",
        "Great Job! 今天也是元氣滿滿的一天！💖",
        "Perfect! 保持這個好習慣！✨",
        "Outstanding! 藥物都有準時吃喔！💯",
        "Superb! 健康的小齒輪轉動得很順暢！💪",
        "Magnificent! 每日任務完成，值得一個愛心！🥰"
    ];
    let lastEncouragementIndex = -1;

    // --- 輔助函式 ---
    function dateToYMD(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function dateToMinguo(date) {
        const year = date.getFullYear();
        const minguoYear = year - 1911;
        const month = date.getMonth() + 1;
        const day = date.getDate();
        return `${minguoYear}年${month}月${day}日`;
    }

    function getLocalStorageKey(dateStr) {
        return `healthRecord_${dateStr}`;
    }

    // --- 核心功能：日曆與月份生成 ---

    function initializeCalendar() {
        const monthTabsContainer = document.getElementById('monthTabs');
        let currentDate = new Date(START_DATE);
        let months = new Set(); // 儲存需要建立的分頁
        let firstMonthKey = '';

        // 遍歷所有日期，找出需要的分頁
        // 修正：使用 do-while 確保至少執行一次，並檢查日期是否在範圍內
        let tempDate = new Date(START_DATE);
        while (tempDate <= END_DATE) {
            const monthKey = `${tempDate.getFullYear()}-${tempDate.getMonth() + 1}`;
            months.add(monthKey);
            
            // 跳到下個月的第一天
            if (tempDate.getMonth() === 11) { // 12月
                tempDate.setFullYear(tempDate.getFullYear() + 1, 0, 1);
            } else {
                tempDate.setMonth(tempDate.getMonth() + 1, 1);
            }
            // 如果新日期超過結束日期，但結束日期在目標月份，仍需包含
            if (tempDate > END_DATE && tempDate.getMonth() !== END_DATE.getMonth()) break;
        }

        // 渲染月份按鈕
        Array.from(months).forEach((monthKey, index) => {
            if (index === 0) firstMonthKey = monthKey;

            const [year, month] = monthKey.split('-');
            const displayYear = parseInt(year) - 1911;
            const displayMonth = parseInt(month);
            
            const button = document.createElement('button');
            button.textContent = `${displayYear}年${displayMonth}月`;
            button.dataset.monthKey = monthKey;
            button.onclick = () => renderCalendarGrid(monthKey);
            monthTabsContainer.appendChild(button);
        });

        // 預設渲染第一個月份 (如果存在)
        if (firstMonthKey) {
            renderCalendarGrid(firstMonthKey);
        } else {
             document.getElementById('calendarGrid').innerHTML = '<p style="text-align: center; color: red;">錯誤：日期範圍無效或已結束。</p>';
        }
    }

    function renderCalendarGrid(activeMonthKey) {
        const calendarGrid = document.getElementById('calendarGrid');
        const monthTabs = document.querySelectorAll('#monthTabs button');
        calendarGrid.innerHTML = '';

        // 更新月份分頁 active 狀態
        monthTabs.forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.monthKey === activeMonthKey) {
                btn.classList.add('active');
            }
        });

        let currentDate = new Date(START_DATE);
        
        while (currentDate <= END_DATE) {
            const currentMonthKey = `${currentDate.getFullYear()}-${currentDate.getMonth() + 1}`;

            if (currentMonthKey === activeMonthKey) {
                const dateStr = dateToYMD(currentDate);
                const recordKey = getLocalStorageKey(dateStr);
                const record = localStorage.getItem(recordKey);

                const card = document.createElement('div');
                card.classList.add('date-card');
                if (record) {
                    card.classList.add('has-record'); // 有紀錄則變色
                }
                card.dataset.date = dateStr;
                card.onclick = () => openRecordModal(dateStr);
                
                const dayOfWeek = ['日', '一', '二', '三', '四', '五', '六'][currentDate.getDay()];

                card.innerHTML = `
                    <h3>${dateToMinguo(currentDate).replace(/年|月|日/g, '/')}</h3>
                    <p>星期 ${dayOfWeek}</p>
                    <p style="font-size: 0.9em; color: ${record ? 'var(--color-green)' : '#aaa'};">${record ? '✅ 已有紀錄' : '❌ 待紀錄'}</p>
                `;
                calendarGrid.appendChild(card);
            }
            
            // 跳到下一天
            currentDate.setDate(currentDate.getDate() + 1);
        }
        updateProgressIndicator();
    }

    // --- (1) 用藥紀錄互動邏輯 ---
    // 檢查用藥完成度並提供鼓勵
    function checkMedicationCompletion() {
        const checkboxes = document.querySelectorAll('#dailyRecordForm input[name="medication"]');
        const feedbackDiv = document.getElementById('medication-feedback');
        const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
        
        if (checkedCount === 4) {
            // 隨機選取不重複的鼓勵訊息
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * encouragementMessages.length);
            } while (newIndex === lastEncouragementIndex);
            lastEncouragementIndex = newIndex;

            const message = encouragementMessages[newIndex];
            
            feedbackDiv.innerHTML = `<span class="medication-success">${message}</span>`;
            feedbackDiv.style.color = 'var(--color-pink)'; // 用愛心色
            feedbackDiv.style.fontSize = '1.5em';
            feedbackDiv.innerHTML += ' 💖'; // 補充愛心貼圖
        } else {
            feedbackDiv.innerHTML = `已完成 ${checkedCount} / 4 次用藥，加油！`;
            feedbackDiv.style.color = '#888';
            feedbackDiv.style.fontSize = '1.2em';
        }
    }

    // --- (2) 睡眠紀錄計算 ---
    function calculateSleepDuration() {
        const sleepTime = document.getElementById('sleepTime').value;
        const wakeTime = document.getElementById('wakeTime').value;
        const durationDisplay = document.getElementById('durationDisplay');
        const sleepDurationHidden = document.getElementById('sleepDuration');

        if (!sleepTime || !wakeTime) {
            durationDisplay.textContent = '請輸入睡眠和清醒時間';
            sleepDurationHidden.value = '';
            return;
        }

        const [sh, sm] = sleepTime.split(':').map(Number);
        const [wh, wm] = wakeTime.split(':').map(Number);

        let sleepDate = new Date(CURRENT_DATE_STR);
        sleepDate.setHours(sh, sm, 0, 0);

        let wakeDate = new Date(CURRENT_DATE_STR);
        wakeDate.setHours(wh, wm, 0, 0);

        // 如果清醒時間比睡覺時間早，則假設清醒日期是隔天
        if (wakeDate < sleepDate) {
            wakeDate.setDate(wakeDate.getDate() + 1);
        }

        const diffMs = wakeDate - sleepDate;
        const totalMinutes = Math.round(diffMs / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        durationDisplay.textContent = `${hours} 小時 ${minutes} 分鐘`;
        sleepDurationHidden.value = totalMinutes; // 儲存總分鐘數
    }

    // --- (3) 運動紀錄動態新增欄位 ---
    let exerciseFieldCount = 2;
    function addExerciseField() {
        exerciseFieldCount++;
        const exerciseInputs = document.getElementById('exerciseInputs');
        const newFields = document.createElement('div');
        newFields.innerHTML = `
            <label>運動 ${exerciseFieldCount}:</label>
            <input type="text" name="exerciseName${exerciseFieldCount}" placeholder="運動名稱">
            <input type="number" name="exerciseDuration${exerciseFieldCount}" placeholder="時間 (分鐘)">
        `;
        exerciseInputs.appendChild(newFields);
    }
    
    // --- Modal 處理邏輯 ---
    function openRecordModal(dateStr) {
        CURRENT_DATE_STR = dateStr;
        const dateObj = new Date(dateStr);
        document.getElementById('modalDateTitle').textContent = `紀錄日期: ${dateToMinguo(dateObj)}`;
        document.getElementById('recordModal').style.display = 'block';

        // 重置表單和邏輯
        document.getElementById('dailyRecordForm').reset();
        document.getElementById('durationDisplay').textContent = '0 小時 0 分鐘';
        document.getElementById('medication-feedback').innerHTML = '';
        
        // 重新生成預設運動欄位
        document.getElementById('exerciseInputs').innerHTML = `
            <label>運動 1:</label><input type="text" name="exerciseName1" placeholder="運動名稱 (如：慢跑)">
            <input type="number" name="exerciseDuration1" placeholder="時間 (分鐘)">
            <label>運動 2 (可選):</label><input type="text" name="exerciseName2" placeholder="運動名稱 (如：瑜伽)">
            <input type="number" name="exerciseDuration2" placeholder="時間 (分鐘)">
        `;
        exerciseFieldCount = 2;


        // 載入儲存的資料 (如果有)
        const record = localStorage.getItem(getLocalStorageKey(dateStr));
        if (record) {
            const data = JSON.parse(record);
            
            // 載入用藥
            data.medication.forEach(val => {
                const cb = document.querySelector(`input[name="medication"][value="${val}"]`);
                if (cb) cb.checked = true;
            });
            checkMedicationCompletion(); // 檢查並顯示鼓勵
            
            // 載入睡眠
            document.getElementById('sleepTime').value = data.sleepTime || '';
            document.getElementById('wakeTime').value = data.wakeTime || '';
            document.getElementById('cantSleep').value = data.cantSleep || '';
            document.getElementById('sleepHelper').value = data.sleepHelper || '';
            calculateSleepDuration();
            
            // 載入運動 (需重新生成欄位)
            document.getElementById('exerciseInputs').innerHTML = '';
            exerciseFieldCount = 0;
            data.exercise.forEach((ex) => {
                exerciseFieldCount++;
                const newFields = document.createElement('div');
                newFields.innerHTML = `
                    <label>運動 ${exerciseFieldCount}:</label>
                    <input type="text" name="exerciseName${exerciseFieldCount}" placeholder="運動名稱" value="${ex.name || ''}">
                    <input type="number" name="exerciseDuration${exerciseFieldCount}" placeholder="時間 (分鐘)" value="${ex.duration || ''}">
                `;
                document.getElementById('exerciseInputs').appendChild(newFields);
            });
            // 如果儲存的欄位少於 2 個，補齊
            while (exerciseFieldCount < 2) {
                addExerciseField();
            }

            // 載入開心紀錄
            document.getElementById('happyEvent').value = data.happyEvent || '';
        }
        // 確保初始時也執行一次檢查，以便顯示 0/4 的狀態
        checkMedicationCompletion();
    }

    function closeModal() {
        document.getElementById('recordModal').style.display = 'none';
        // 重新渲染日曆網格，確保卡片顏色更新
        const activeMonthButton = document.querySelector('#monthTabs button.active');
        if (activeMonthButton) {
             renderCalendarGrid(activeMonthButton.dataset.monthKey);
        }
    }

    // --- 表單提交與儲存 ---
    document.getElementById('dailyRecordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const data = {};

        // 處理用藥 (checkboxes)
        data.medication = [];
        formData.getAll('medication').forEach(val => data.medication.push(val));
        
        // 處理睡眠
        data.sleepTime = formData.get('sleepTime');
        data.wakeTime = formData.get('wakeTime');
        data.sleepDuration = formData.get('sleepDuration'); // 總分鐘數
        data.cantSleep = formData.get('cantSleep');
        data.sleepHelper = formData.get('sleepHelper');

        // 處理運動 (動態欄位)
        data.exercise = [];
        for (let i = 1; i <= exerciseFieldCount; i++) {
            const name = formData.get(`exerciseName${i}`);
            const duration = formData.get(`exerciseDuration${i}`);
            // 只有當名稱或時間有輸入時才儲存
            if (name || duration) {
                data.exercise.push({ name: name || '', duration: parseInt(duration) || '' });
            }
        }

        // 處理開心紀錄
        data.happyEvent = formData.get('happyEvent');

        // 儲存到 localStorage
        localStorage.setItem(getLocalStorageKey(CURRENT_DATE_STR), JSON.stringify(data));
        alert(`🎉 ${CURRENT_DATE_STR} 的紀錄已成功儲存！`);
        closeModal();
    });

    // --- (5) 進度表追蹤 ---
    function updateProgressIndicator() {
        let totalDays = 0;
        let recordedDays = 0;
        let currentDate = new Date(START_DATE);

        // 計算總天數和已紀錄天數
        while (currentDate <= END_DATE) {
            totalDays++;
            const dateStr = dateToYMD(currentDate);
            if (localStorage.getItem(getLocalStorageKey(dateStr))) {
                recordedDays++;
            }
            currentDate.setDate(currentDate.getDate() + 1);
        }

        document.getElementById('progressIndicator').textContent = `總體紀錄進度：${recordedDays} / ${totalDays} 天`;
    }

    // --- (5) 下載 Excel 檔 (CSV 模擬) ---
    function downloadData() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // \uFEFF 確保 Excel 正確顯示中文
        const headers = [
            "日期", "用藥(早餐)", "用藥(午餐)", "用藥(晚餐)", "用藥(睡前)", 
            "入睡時間", "清醒時間", "睡眠總時間(分鐘)", "睡不著建議", "長睡秘訣", 
            "運動項目1", "運動時間1(分鐘)", "運動項目2", "運動時間2(分鐘)", "運動項目3", "運動時間3(分鐘)", // 預留3項
            "開心紀錄"
        ];
        csvContent += headers.join(",") + "\n";
        
        let currentDate = new Date(START_DATE);

        while (currentDate <= END_DATE) {
            const dateStr = dateToYMD(currentDate);
            const recordKey = getLocalStorageKey(dateStr);
            const record = localStorage.getItem(recordKey);

            let row = [dateStr];

            if (record) {
                const data = JSON.parse(record);
                
                // 用藥
                const meds = data.medication || [];
                row.push(meds.includes('breakfast') ? 'V' : '');
                row.push(meds.includes('lunch') ? 'V' : '');
                row.push(meds.includes('dinner') ? 'V' : '');
                row.push(meds.includes('bedtime') ? 'V' : '');

                // 睡眠
                row.push(data.sleepTime || '');
                row.push(data.wakeTime || '');
                row.push(data.sleepDuration || '');
                // 處理文字內含逗號或換行
                const escapeCsv = (text) => text ? `"${text.replace(/"/g, '""').replace(/\n/g, ' ')}"` : '';
                row.push(escapeCsv(data.cantSleep));
                row.push(escapeCsv(data.sleepHelper));

                // 運動 (最多取3項)
                const exercises = data.exercise || [];
                for (let i = 0; i < 3; i++) {
                    if (exercises[i]) {
                        row.push(escapeCsv(exercises[i].name));
                        row.push(exercises[i].duration || '');
                    } else {
                        row.push(''); row.push('');
                    }
                }

                // 開心紀錄
                row.push(escapeCsv(data.happyEvent));

            } else {
                 // 如果沒有紀錄，填入空白，確保欄位對齊 (headers.length - 1 個欄位)
                 row.push(...Array(headers.length - 1).fill(''));
            }

            csvContent += row.join(",") + "\n";
            currentDate.setDate(currentDate.getDate() + 1);
        }

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "健康紀錄表_" + new Date().toISOString().slice(0, 10) + ".csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        alert("CSV 紀錄檔已下載，可使用 Excel 或其他試算表軟體開啟。");
    }

    // --- 程式初始化：確保網頁載入後立即執行 ---
    window.onload = initializeCalendar;
</script>
